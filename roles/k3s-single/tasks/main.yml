---
- name: Ensure dependencies are present (Arch)
  pacman:
    name: "{{ k3s_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'

# You can swap this to kewlfft.aur.aur if you prefer
- name: Install k3s-bin via yay (AUR)
  shell: yay -S --noconfirm --needed k3s-bin
  args:
    creates: /usr/bin/k3s

- name: Check if k3s systemd service file exists
  stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_service_file

- name: Create k3s systemd service file
  copy:
    dest: /etc/systemd/system/k3s.service
    content: |
      [Unit]
      Description=Lightweight Kubernetes
      Documentation=https://k3s.io
      Wants=network-online.target
      After=network-online.target

      [Install]
      WantedBy=multi-user.target

      [Service]
      Type=notify
      EnvironmentFile=-/etc/default/%N
      EnvironmentFile=-/etc/sysconfig/%N
      EnvironmentFile=-/etc/systemd/system/k3s.service.env
      KillMode=process
      Delegate=yes
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      TimeoutStartSec=0
      Restart=always
      RestartSec=5s
      ExecStartPre=/bin/sh -xc '! /usr/bin/systemctl is-enabled --quiet nm-cloud-setup.service 2>/dev/null'
      ExecStartPre=-/sbin/modprobe br_netfilter
      ExecStartPre=-/sbin/modprobe overlay
      ExecStart=/usr/bin/k3s server
    mode: '0644'
  when: not k3s_service_file.stat.exists
  register: k3s_service_created

- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  when: k3s_service_created.changed | default(false)

- name: Enable and start K3s server
  systemd:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
